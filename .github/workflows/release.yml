# Builds and releases the package when a strict semver tag of the form
# vX.Y.Z is pushed. The full CI matrix runs again together with a single
# audit pass as a final gate. The sdist and wheel are then built and a
# draft GitHub release is created with both artifacts attached. Release
# notes are written manually in the GitHub UI before the draft is
# published. See docs/release.md for the full runbook.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CASCC_API_KEY: ${{ secrets.CASCC_API_KEY }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format and version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match the strict pattern v[0-9]+.[0-9]+.[0-9]+"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches pyproject.toml version $PYPROJECT_VERSION."

  test:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-extras --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Test with pytest
        run: uv run pytest

  audit:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev tooling
        run: uv sync --locked --all-extras --group dev

      - name: Run dependency audit
        run: bash scripts/audit-deps.sh

      - name: Render audit and license findings
        id: render
        run: uv run python scripts/render-audit.py --output audit-summary.md

      - name: Append findings to workflow summary
        run: cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail release on findings
        if: steps.render.outputs.has_findings == 'true'
        run: |
          echo "::error::Audit found vulnerabilities or disallowed licenses; see workflow summary."
          exit 1

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            audit.json
            licenses.json
            audit-summary.md
            requirements-audit.txt
          if-no-files-found: warn

  coverage:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev tooling
        run: uv sync --locked --all-extras --group dev

      - name: Run tests with coverage
        run: uv run pytest

      - name: Render coverage summary
        run: bash scripts/render-coverage.sh coverage-summary.md

      - name: Append findings to workflow summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            cov.xml
            coverage-summary.md
          if-no-files-found: warn

  release:
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync runtime dependencies (locked)
        run: uv sync --locked

      - name: Build sdist and wheel
        run: uv build

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --notes "Release notes pending. Edit this draft to add release notes before publishing." \
            dist/*.whl dist/*.tar.gz
