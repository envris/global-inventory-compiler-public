# Audits the locked runtime dependencies against the latest vulnerability
# database on a schedule. New vulnerabilities can be disclosed against
# pinned versions long after they were locked, so this runs independently
# of code changes.
#
# A single rolling tracking issue is maintained under the `dep-audit`
# label. When findings are present, the issue body is opened or updated
# with the rendered markdown. When findings are clean, the issue is
# closed if it is open. This avoids issue spam while keeping a visible
# signal in the issues tab.

name: Scheduled dependency audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      ISSUE_TITLE: "Dependency vulnerability tracker"
      ISSUE_LABEL: "dep-audit"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev tooling
        run: uv sync --locked --all-extras --group dev

      - name: Run dependency audit
        run: bash scripts/audit-deps.sh

      - name: Render audit and license findings
        id: render
        run: uv run python scripts/render-audit.py --output audit-summary.md

      - name: Append findings to workflow summary
        run: cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/manage-audit-issue.sh \
            "$ISSUE_LABEL" \
            "$ISSUE_TITLE" \
            audit-summary.md \
            "${{ steps.render.outputs.has_findings }}"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            audit.json
            licenses.json
            audit-summary.md
            requirements-audit.txt
          if-no-files-found: warn
