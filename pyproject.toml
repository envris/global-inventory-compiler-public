[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gic"
version = "1.0.3"
description = "A Python library for integrating regulatory chemical lists into a unified global inventory for analysis, comparison, and screening."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "pillow>=12.3.0,<13",
  "pypdf>=6.20.0,<7",
  "rdkit>=2026.9.1,<2027"
]
authors = [{ name = "Daniel Weber", email = "daniel.weber@dcceew.gov.au" }]
maintainers = [{ name = "Daniel Weber", email = "daniel.weber@dcceew.gov.au" }]
keywords = [
  "chemicals",
  "inventory",
  "regulatory",
  "data integration",
  "data analysis",
  "cheminformatics",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/envris/global-inventory-compiler"
Repository = "https://github.com/envris/global-inventory-compiler.git"
Issues = "https://github.com/envris/global-inventory-compiler/issues"

[project.scripts]
gic-build = "gic.workflows.build:main"
gic-stats = "gic.workflows.stats:main"
gic-gremlins = "gic.workflows.gremlins:main"

[dependency-groups]
dev = ["pip-audit", "pip-licenses", "pyright", "pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-vv --cov=src/gic --cov-report=xml:cov.xml"

[tool.pyright]
include = ["src"]
exclude = ["**/.venv", "**/__pycache__", "**/node_modules", "**/.*"]
typeCheckingMode = "basic"
diagnosticMode = "workspace"
useLibraryCodeForTypes = true
pythonVersion = "3.14"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle
  "W",   # pycodestyle
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "T20", # flake8-print
  "S",   # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
# Allow S101 (use of assert) in test files
"tests/**/*.py" = ["S101"]
# Allow print statements in example notebooks
"examples/**/*.ipynb" = ["T20"]
