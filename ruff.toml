[format]
quote-style = "double"
indent-style = "space"

[lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "T20", # flake8-print
    "S", # flake8-bandit
]

[lint.per-file-ignores]
# Allow S101 (use of assert) in test files
"tests/**/*.py" = ["S101"]
# Allow print statements in example notebooks
"examples/**/*.ipynb" = ["T20"]